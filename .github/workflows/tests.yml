name: tests

# The unittest suites on Linux and macOS, with the oldest Python restore
# supports (3.9, which macOS ships as /usr/bin/python3) and a current one.
# The live macOS tests (tests/test_live_macos.py) open real windows and skip
# themselves unless SMGO_LIVE=1, so they do not run here.

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: macos-latest, python: "3.9" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile restore_terminals.py find_session.py termui.py
      - name: Test
        run: python -m unittest discover -s tests -v

  # setup-python has no 3.9 build for the current ubuntu-latest, so the oldest
  # Python runs on Linux in the official image instead
  unittest-linux-python39:
    runs-on: ubuntu-latest
    container: python:3.9-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python -m py_compile restore_terminals.py find_session.py termui.py
      - name: Test
        run: python -m unittest discover -s tests -v
